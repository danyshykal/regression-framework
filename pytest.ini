[pytest]
testpaths = tests
addopts =
    -v -rs
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/report.html --self-contained-html
markers =
    smoke: critical checks run first, on every build
    regression: existing behaviour that must keep working in every release
    new_feature: tests for features added in a newer release
    since(version): the feature exists only from this release onwards
